name: Resize uploaded images
on:
  push:
    branches: [main]
    paths: ['img/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: images
  cancel-in-progress: false
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python scripts/resize_images.py
      - name: Commit resized images
        run: |
          git config user.name "Image resizer"
          git config user.email "actions@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then echo "Nothing to do"; exit 0; fi
          git commit -m "Resize uploaded images and make previews"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
